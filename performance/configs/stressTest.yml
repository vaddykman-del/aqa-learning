config:
  target: "https://httpbin.io/"
  phases:
    - duration: 30
      arrivalRate: 1
      rampTo: 8
      name: Ramp up
    - duration: 20
      arrivalRate: 8
      name: Hold at peak
    - duration: 20
      arrivalRate: 1
      name: Recovery
  plugins:
    ensure: {}
  ensure:
    thresholds:
      - http.response_time.p95: 1000
    conditions:
      - expression: vusers.failed == 0
scenarios:
  - name: Getting a resource
    flow:
      - get:
          url: "{{ target }}get"
      - post:
          url: "{{ target }}post"
          json:
            username: "Test User"
            password: "Temp Password"
          capture:
            - json: "$.json"
              as: "request_body"
            - json: "$.headers.Host"
              as: "host"
